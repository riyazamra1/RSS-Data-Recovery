name: RSS Data Recovery UX Fixes

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UX fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/riyaz/rssdatarecovery/RecoveryAppV2.kt')
          s = p.read_text()
          s = s.replace('RegistrationV2 { name, email ->', 'RegistrationV3 { name, email ->')
          s = s.replace('private fun BrandV2()', 'fun BrandV2()')
          s = s.replace('ModalNavigationDrawer(\n        drawerState = drawer,\n        drawerContent = {', 'ModalNavigationDrawer(\n        drawerContent = {')
          s = s.replace('else IconButton({ back() }) { Icon(Icons.Default.ArrowBack, "Back") }', '')
          p.write_text(s)
          styles = Path('app/src/main/res/values/styles.xml')
          styles.write_text(styles.read_text().replace('<item name="android:postSplashScreenTheme">@style/Theme.RSSDataRecovery</item>\n', ''))
          PY
      - name: Build verification
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rss-data-recovery-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Commit fixes
        run: |
          git config user.name 'rss-ux-fix-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/riyaz/rssdatarecovery/RecoveryAppV2.kt app/src/main/res/values/styles.xml
          git diff --cached --quiet || (git commit -m 'Fix bottom navigation and build [ux-fix-bot]' && git push)
