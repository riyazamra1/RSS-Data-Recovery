name: RSS Data Recovery Requirements Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    if: ${{ !contains(github.event.head_commit.message, '[requirements-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply current UX and recovery requirements
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/riyaz/rssdatarecovery/RecoveryAppV2.kt')
          s = p.read_text()

          # Keep device/Android Back navigation, with no visible Back arrow.
          s = s.replace(
              'navigationIcon = { if (screen == RScreen.HOME) IconButton({ menu = true }) { Icon(Icons.Default.Menu, "Menu") } else IconButton({ back() }) { Icon(Icons.Default.ArrowBack, "Back") } },',
              'navigationIcon = { if (screen == RScreen.HOME) IconButton({ menu = true }) { Icon(Icons.Default.Menu, "Menu") } },'
          )

          # Fix Material3 drawer invocation and provide the LocalContext used by contact actions.
          s = s.replace('    BackHandler(menu || history.size > 1) { back() }\n', '    val context = LocalContext.current\n    BackHandler(menu || history.size > 1) { back() }\n')
          s = s.replace('    ModalNavigationDrawer(drawer, {', '    ModalNavigationDrawer(drawerState = drawer, drawerContent = {', 1)

          # BrandV2 is shared with the generated registration screen.
          s = s.replace('@Composable private fun BrandV2()', '@Composable fun BrandV2()', 1)

          # Free Quick Recovery saves files, but with deliberately limited output quality/name/metadata.
          old_compare = '''"Recover & save files" to Pair("—", "✓"),
        "Original filenames" to Pair("Preview", "✓"),
        "Metadata preservation" to Pair("Preview", "✓"),'''
          new_compare = '''"Recover & save files" to Pair("✓", "✓"),
        "Original filenames" to Pair("Generic name", "Original"),
        "Metadata preservation" to Pair("Not preserved", "Preserved"),
        "Image quality" to Pair("Reduced", "Original / best available"),'''
          s = s.replace(old_compare, new_compare, 1)

          old_scan = 'Text("Free users can scan and preview recoverable files. Premium is required only to save/recover selected files.", style = MaterialTheme.typography.bodySmall)'
          new_scan = '''Text(
            if (mode == RMode.QUICK)
                "Free Quick Recovery can recover and save files. Free recovery uses a reduced-quality copy with a generic filename and without original metadata. Premium preserves the original filename, available metadata and best available image quality."
            else
                "Deep Recovery scanning and preview are available to Free users. Premium is required to recover Deep Recovery results with original filename, metadata and best available quality.",
            style = MaterialTheme.typography.bodySmall
        )'''
          s = s.replace(old_scan, new_scan, 1)

          # Replace the result list with a premium-offer dialog shown whenever a Free user taps Recover.
          start = s.find('@Composable private fun ResultsV2')
          end = s.find('\n@Composable private fun PremiumV2', start)
          if start >= 0 and end > start:
              results = r'''@Composable private fun ResultsV2(upgrade: () -> Unit) {
    var showPremiumOffer by remember { mutableStateOf(false) }
    var selectedFile by remember { mutableStateOf("") }
    LazyColumn(Modifier.fillMaxSize().padding(20.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
        item {
            Row(verticalAlignment = Alignment.CenterVertically) {
                Column(Modifier.weight(1f)) {
                    Text("Recoverable files", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Bold)
                    Text("Quick Recovery can be recovered free with quality limits")
                }
                Button(upgrade) { Text("Upgrade") }
            }
        }
        items(listOf("IMG_20260814_183201.jpg", "VID_20260729_221045.mp4", "document_2026.pdf")) { n ->
            Card(shape = RoundedCornerShape(18.dp)) {
                Row(Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                    Icon(Icons.Default.InsertDriveFile, null)
                    Spacer(Modifier.width(10.dp))
                    Text(n, Modifier.weight(1f), maxLines = 1, overflow = TextOverflow.Ellipsis)
                    Button({ selectedFile = n; showPremiumOffer = true }) { Text("Recover") }
                }
            }
        }
    }
    if (showPremiumOffer) {
        AlertDialog(
            onDismissRequest = { showPremiumOffer = false },
            icon = { Icon(Icons.Default.WorkspacePremium, null, tint = MaterialTheme.colorScheme.primary) },
            title = { Text("Get the best recovery quality") },
            text = {
                Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                    Text("Premium gives you the full-quality recovery of ${selectedFile.ifBlank { "this file" }}.")
                    Card(shape = RoundedCornerShape(18.dp), colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.primaryContainer)) {
                        Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(9.dp)) {
                            Text("Premium includes", fontWeight = FontWeight.Bold)
                            Text("✓ Original filename")
                            Text("✓ Available original metadata")
                            Text("✓ Original / best available image quality")
                            Text("✓ Full recovery protection")
                            Text("✓ Premium recovery for Deep Recovery results")
                        }
                    }
                    Text("Free recovery is still available: it saves a reduced-quality copy with a generic filename and without original metadata.", style = MaterialTheme.typography.bodySmall)
                }
            },
            confirmButton = {
                Button({ showPremiumOffer = false; upgrade() }) { Text("Upgrade to Premium") }
            },
            dismissButton = {
                TextButton({ showPremiumOffer = false }) { Text("Continue free") }
            }
        )
    }
}
'''
              s = s[:start] + results + s[end:]

          old_feature = 'item { FeatureV2(Icons.Default.Save, "Save recovered files", "Save recovered files into the RSS Data Recovery folder.") }'
          new_feature = 'item { FeatureV2(Icons.Default.Save, "Save recovered files", "Free Quick Recovery can save reduced-quality copies. Premium unlocks original filenames, available metadata and best available image quality in the RSS Data Recovery folder.") }'
          s = s.replace(old_feature, new_feature, 1)

          p.write_text(s)
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rss-data-recovery-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Commit UX requirements
        run: |
          git config user.name 'rss-requirements-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/riyaz/rssdatarecovery/RecoveryAppV2.kt
          git diff --cached --quiet || (git commit -m 'Apply current RSS Data Recovery UX requirements [requirements-fix]' && git push)
