name: RSS Data Recovery Welcome Screen Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[welcome-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add congratulations screen after registration
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/riyaz/rssdatarecovery/RecoveryAppV2.kt')
          s = p.read_text()

          old_state = 'var registered by remember { mutableStateOf(prefs.getBoolean("registered", false)) }'
          new_state = old_state + '\n    var showWelcome by remember { mutableStateOf(false) }'
          if 'var showWelcome by remember' not in s:
              if old_state not in s:
                  raise SystemExit('registered state not found')
              s = s.replace(old_state, new_state, 1)

          old_flow = 'if (!registered) RegistrationV2 { name, email -> prefs.edit().putBoolean("registered", true).putString("name", name).putString("email", email).apply(); registered = true }\n        else RecoveryShellV2(dark, { dark = it; prefs.edit().putBoolean("dark", it).apply() })'
          new_flow = '''if (!registered) RegistrationV2 { name, email ->
            prefs.edit().putBoolean("registered", true).putString("name", name).putString("email", email).apply()
            registered = true
            showWelcome = true
        } else if (showWelcome) WelcomeCustomerV2(prefs.getString("name", "Customer") ?: "Customer") { showWelcome = false }
        else RecoveryShellV2(dark, { dark = it; prefs.edit().putBoolean("dark", it).apply() })'''
          if old_flow in s:
              s = s.replace(old_flow, new_flow, 1)
          elif 'else if (showWelcome) WelcomeCustomerV2' not in s:
              raise SystemExit('registration flow not found')

          welcome = r'''
@Composable private fun WelcomeCustomerV2(name: String, continueApp: () -> Unit) {
    val transition = androidx.compose.animation.core.rememberInfiniteTransition(label = "customerWelcome")
    val drift by transition.animateFloat(
        initialValue = 0f,
        targetValue = 1f,
        animationSpec = androidx.compose.animation.core.infiniteRepeatable(
            animation = androidx.compose.animation.core.tween(6500),
            repeatMode = androidx.compose.animation.core.RepeatMode.Reverse
        ),
        label = "welcomeDrift"
    )
    Box(Modifier.fillMaxSize().background(Color(0xFF070707))) {
        Box(Modifier.fillMaxSize().background(
            androidx.compose.ui.graphics.Brush.radialGradient(
                colors = listOf(Color(0xFFFFC83D).copy(alpha = 0.28f), Color.Transparent),
                center = androidx.compose.ui.geometry.Offset(170f + drift * 500f, 180f),
                radius = 560f
            )
        ))
        Box(Modifier.fillMaxSize().background(
            androidx.compose.ui.graphics.Brush.radialGradient(
                colors = listOf(Color(0xFF6B4A00).copy(alpha = 0.30f), Color.Transparent),
                center = androidx.compose.ui.geometry.Offset(800f - drift * 420f, 1050f),
                radius = 500f
            )
        ))
        Column(
            Modifier.fillMaxSize().padding(24.dp),
            horizontalAlignment = Alignment.CenterHorizontally,
            verticalArrangement = Arrangement.Center
        ) {
            Box(Modifier.size(104.dp).clip(CircleShape).background(Color(0xFF19140A)), Alignment.Center) {
                Text("✓", color = Color(0xFFFFD76A), style = MaterialTheme.typography.displaySmall, fontWeight = FontWeight.Bold)
            }
            Spacer(Modifier.height(26.dp))
            Text("Congratulations! 🎉", color = Color(0xFFFFD76A), style = MaterialTheme.typography.headlineMedium, fontWeight = FontWeight.Bold)
            Spacer(Modifier.height(10.dp))
            Text("Welcome, $name", color = Color.White, style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.SemiBold)
            Spacer(Modifier.height(10.dp))
            Text(
                "Your RSS Data Recovery profile is ready.\nYou can now start scanning and protecting your recoverable files.",
                color = Color.White.copy(alpha = 0.74f),
                style = MaterialTheme.typography.bodyLarge,
                textAlign = androidx.compose.ui.text.style.TextAlign.Center
            )
            Spacer(Modifier.height(28.dp))
            Card(Modifier.fillMaxWidth(), shape = RoundedCornerShape(24.dp), colors = CardDefaults.cardColors(containerColor = Color.White.copy(alpha = 0.09f))) {
                Column(Modifier.padding(20.dp)) {
                    Text("Your account is ready", color = Color.White, fontWeight = FontWeight.Bold)
                    Spacer(Modifier.height(6.dp))
                    Text("Welcome to the RSS Data Recovery family.", color = Color.White.copy(alpha = 0.62f), style = MaterialTheme.typography.bodySmall)
                    Spacer(Modifier.height(18.dp))
                    Button(onClick = continueApp, modifier = Modifier.fillMaxWidth().height(54.dp), shape = RoundedCornerShape(16.dp), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFFFC83D), contentColor = Color(0xFF191300))) {
                        Text("Start Recovering", fontWeight = FontWeight.Bold)
                        Spacer(Modifier.width(8.dp))
                        Icon(Icons.Default.ArrowForward, null)
                    }
                }
            }
            Spacer(Modifier.height(18.dp))
            Text("Razeen Secure Solution • RSS Data Recovery", color = Color.White.copy(alpha = 0.42f), style = MaterialTheme.typography.labelSmall)
        }
    }
}
'''
          if 'private fun WelcomeCustomerV2' not in s:
              marker = '\n@OptIn(ExperimentalMaterial3Api::class)'
              if marker not in s:
                  raise SystemExit('screen insertion marker not found')
              s = s.replace(marker, '\n' + welcome + marker, 1)

          p.write_text(s)
      - name: Build verification
        run: gradle :app:assembleDebug --no-daemon
      - name: Commit
        run: |
          git config user.name 'rss-welcome-fix-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/riyaz/rssdatarecovery/RecoveryAppV2.kt
          git diff --cached --quiet || (git commit -m 'Add congratulations welcome after registration [welcome-fix]' && git push)
